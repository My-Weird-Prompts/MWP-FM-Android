Name: MWP FM
Summary: Stream the My Weird Prompts podcast and its non-stop radio
Description: |-
  MWP FM is the official app for My Weird Prompts, the human-AI collaboration
  podcast. Browse, search and stream the whole back catalogue, or tune in to radio
  mode for a continuous station.

  The app is a Trusted Web Activity: it opens https://stream.myweirdprompts.com
  full-screen, so new features arrive without an app update. It needs Chrome or
  another browser that supports Trusted Web Activities. Without one, it opens in a
  Custom Tab.
AntiFeatures:
  NonFreeNet:
    en-US: Plays content from the My Weird Prompts web service.
